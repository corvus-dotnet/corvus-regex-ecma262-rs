# Build, clippy (warnings denied), the tests, the ECMA-262 test data, the C smoke test and the test data through the C
# library, on Linux and Windows. The data (github.com/corvus-dotnet/ecma262-regex-test-data) is pinned to a commit;
# the pass is 0 wrong answers, 0 refusals of a valid pattern, 0 acceptances of an invalid one and 0 matches at their
# limit, in both encodings, through the crate and through the C library, and on Linux for Unicode 13 and 18 and for
# the grammar of ECMAScript 2020 as the data's overlays write the data for them. On Linux, CI also makes the generated
# Unicode data again from the Unicode Character Database and fails unless it is the checked-in data.
name: ci
on:
  push:
    branches:
    - main
  pull_request:
  schedule:
  - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Install the toolchain of rust-toolchain.toml
      run: rustup show
    - name: Format
      if: runner.os == 'Linux'
      run: cargo fmt --all --check
    - name: Build
      run: cargo build -j 4 --workspace --all-targets
    - name: Clippy
      run: cargo clippy -j 4 --workspace --all-targets -- -D warnings
    - name: Test
      run: cargo test -j 4 --workspace
    - name: Test with the memory of failed places from the first step
      if: runner.os == 'Linux'
      run: cargo test -j 4 -p corvus-regex-ecma262
      env:
        RUSTFLAGS: --cfg corvus_memo_from_the_start
        CARGO_TARGET_DIR: target/memo
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: corvus-dotnet/ecma262-regex-test-data
        ref: e3041c18c5f5ce40c18af25023085c60befa16d8
        path: ecma262-regex-test-data
        persist-credentials: false
    - name: The generated Unicode data is what its sources make
      # The tables of Unicode 13, 17 and 18, the properties of strings and the property names of ECMAScript 2020, made
      # again from the Unicode Character Database, regress's gen-unicode and the test data (tools/unicode).
      if: runner.os == 'Linux'
      shell: pwsh
      run: ./tools/unicode/check-tables.ps1 -Properties ecma262-regex-test-data/es2020-properties.json -WorkDirectory "$env:RUNNER_TEMP/unicode-check"
    - name: The checked-in counts were made at this commit of the test data
      # The compliance of an engine too slow to judge every night is checked in beside the harness, with the commit of
      # the data it was made at (dataCommit); the benchmark page judges it against that commit. Moving the pin above
      # means working them out again (docs/benchmarks/README.md), so they cannot fall behind it unnoticed.
      if: runner.os == 'Linux'
      run: |
        pin=$(git -C ecma262-regex-test-data rev-parse HEAD)
        fail=0
        for f in $(git ls-files | grep -E '(^|/)compliance-[^/]*\.json$'); do
          made=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("dataCommit", "none"))' "$f")
          if [ "$made" != "$pin" ]; then
            echo "::error file=$f::$f was made at $made, not the data CI checks out ($pin): work its counts out again at that commit."
            fail=1
          fi
        done
        exit $fail
    - name: Probe for stack overflows
      # Deep, wide and long patterns in every grammar through every member, each in a process of its own on stacks
      # of 8 MB, 1 MB and 256 KB: none may end the process (tools/src/bin/stack-probe.rs).
      run: cargo run -j 4 --release --bin stack-probe
    - name: Run the ECMA-262 test data
      run: cargo run -j 4 --release --bin dataset -- ecma262-regex-test-data/data wrong-cases.tsv
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: runner.os == 'Linux'
      with:
        node-version: '24.22.1'
    - name: Run the ECMA-262 test data for other versions of Unicode and for ECMAScript 2020
      # The data as its own scripts write it for Unicode 13 and 18 (unicode.js apply) and for the grammar of
      # ECMAScript 2020 (edition.js apply), each judged with the crate set to match.
      if: runner.os == 'Linux'
      shell: pwsh
      run: |
        $runner = './target/release/dataset'
        $data = 'ecma262-regex-test-data'
        $runs = @(
            @{ Name = 'unicode-13'; Tool = 'unicode.js'; Version = '13.0'; Options = @('--unicode', '13') },
            @{ Name = 'unicode-18'; Tool = 'unicode.js'; Version = '18.0'; Options = @('--unicode', '18') },
            @{ Name = 'es2020'; Tool = 'edition.js'; Version = ''; Options = @('--edition', 'es2020') },
            @{ Name = 'es2020-unicode-13'; Tool = 'edition.js'; Version = '13.0'; Options = @('--edition', 'es2020', '--unicode', '13') }
        )
        $failed = @()
        foreach ($run in $runs) {
            $out = Join-Path $env:RUNNER_TEMP $run.Name
            if ($run.Tool -eq 'unicode.js') {
                node "$data/unicode.js" apply $run.Version $out "$data/data"
            }
            else {
                # An empty version is the data's own Unicode.
                node "$data/edition.js" apply $out $run.Version "$data/data"
            }

            if ($LASTEXITCODE -ne 0) { throw "The data for $($run.Name) was not written." }
            & $runner $out "wrong-cases-$($run.Name).tsv" '*.jsonl' both @($run.Options)
            if ($LASTEXITCODE -ne 0) { $failed += $run.Name }
        }

        if ($failed.Count -gt 0) { throw "Wrong: $($failed -join ', ')" }
    - name: Run the ECMA-262 test data with the memory of failed places from the first step
      if: runner.os == 'Linux'
      run: cargo run -j 4 --release --bin dataset -- ecma262-regex-test-data/data wrong-cases-memo.tsv
      env:
        RUSTFLAGS: --cfg corvus_memo_from_the_start
        CARGO_TARGET_DIR: target/memo
    - name: Check that docs/api-c.md is what the C header makes
      if: runner.os == 'Linux'
      shell: pwsh
      run: ./tools/docs/gen-api-c.ps1 -Check
    - name: Build the C library
      run: cargo build -j 4 --release -p corvus-regex-ecma262-capi
    - name: The C smoke test
      shell: bash
      run: |
        cmake -S corvus-regex-ecma262-capi/tests/native -B build/native -DCRE_LIB_DIR="$PWD/target/release"
        cmake --build build/native --config Release
        ctest --test-dir build/native -C Release --output-on-failure
    - name: The ECMA-262 test data through the C library
      # A C program (tools/c/dataset.c) linking the library through its header, judged as the Rust runner judges the
      # crate: 0 wrong, and every file's counts the crate's.
      shell: bash
      run: |
        cmake -S tools/c -B build/tools -DCRE_LIB_DIR="$PWD/target/release"
        cmake --build build/tools --config Release -j 4
        build/tools/bin/dataset ecma262-regex-test-data/data wrong-cases-c.tsv | tee dataset-c.txt
        target/release/dataset ecma262-regex-test-data/data wrong-cases.tsv > dataset-rust.txt
        counts() { sed -E 's/ +[0-9.]+s\r?$//; s/  in [0-9.]+s\r?$//' "$1"; }
        diff <(counts dataset-rust.txt) <(counts dataset-c.txt)
    - name: Keep the wrong cases
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wrong-cases-${{ matrix.os }}
        path: wrong-cases*.tsv

  capi:
    # The C library's archives on every release platform (capi.yml), with no filter of paths, so the gate can
    # require them. The probe tag runs the release's stamping (tools/release/stamp.ps1) in every job.
    uses: ./.github/workflows/capi.yml
    with:
      tag: v99.98.97

  gate:
    # The one check of this workflow that the ruleset of main requires: it passes when every job above passed (or was
    # skipped), so a job added here is required with no change to the ruleset.
    name: CI gate
    if: always()
    needs: [build, capi]
    runs-on: ubuntu-latest
    steps:
    - name: Every job passed
      env:
        RESULTS: ${{ toJSON(needs.*.result) }}
      run: |
        echo "$RESULTS"
        if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi

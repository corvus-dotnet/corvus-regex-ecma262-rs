# Build, clippy (warnings denied), the tests, the ECMA-262 test data, the C smoke test and the test data through the C
# library, on Linux and Windows. The data (github.com/corvus-dotnet/ecma262-regex-test-data) is pinned to a commit;
# the pass is 0 wrong answers, 0 refusals of a valid pattern, 0 acceptances of an invalid one and 0 matches at their
# limit, in both encodings, through the crate and through the C library.
name: ci
on:
  push:
    branches:
    - main
  pull_request:
  schedule:
  - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Install the toolchain of rust-toolchain.toml
      run: rustup show
    - name: Format
      if: runner.os == 'Linux'
      run: cargo fmt --all --check
    - name: Build
      run: cargo build -j 4 --workspace --all-targets
    - name: Clippy
      run: cargo clippy -j 4 --workspace --all-targets -- -D warnings
    - name: Test
      run: cargo test -j 4 --workspace
    - name: Test with the memory of failed places from the first step
      if: runner.os == 'Linux'
      run: cargo test -j 4 -p corvus-regex-ecma262
      env:
        RUSTFLAGS: --cfg corvus_memo_from_the_start
        CARGO_TARGET_DIR: target/memo
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: corvus-dotnet/ecma262-regex-test-data
        ref: 766d23da87b14ea5ec06f8f439e3e4bea9ebbe09
        path: ecma262-regex-test-data
        persist-credentials: false
    - name: The checked-in counts were made at this commit of the test data
      # The counts of an engine too slow to judge every night are checked in beside the harness, their first line the
      # commit of the data they were made at; the benchmark page judges them against that commit. Moving the pin above
      # means working them out again (docs/benchmarks/README.md), so they cannot fall behind it unnoticed.
      if: runner.os == 'Linux'
      run: |
        pin=$(git -C ecma262-regex-test-data rev-parse HEAD)
        fail=0
        for f in $(git ls-files | grep -E '(^|/)compliance-[^/]*\.txt$'); do
          first=$(head -n 1 "$f")
          if [ "$first" != "data $pin" ]; then
            echo "::error file=$f::$f says '$first', not the data CI checks out ($pin): work its counts out again at that commit."
            fail=1
          fi
        done
        exit $fail
    - name: Probe for stack overflows
      # Deep, wide and long patterns in every grammar through every member, each in a process of its own on stacks
      # of 8 MB, 1 MB and 256 KB: none may end the process (tools/src/bin/stack-probe.rs).
      run: cargo run -j 4 --release --bin stack-probe
    - name: Run the ECMA-262 test data
      run: cargo run -j 4 --release --bin dataset -- ecma262-regex-test-data/data wrong-cases.tsv
    - name: Run the ECMA-262 test data with the memory of failed places from the first step
      if: runner.os == 'Linux'
      run: cargo run -j 4 --release --bin dataset -- ecma262-regex-test-data/data wrong-cases-memo.tsv
      env:
        RUSTFLAGS: --cfg corvus_memo_from_the_start
        CARGO_TARGET_DIR: target/memo
    - name: Build the C library
      run: cargo build -j 4 --release -p corvus-regex-ecma262-capi
    - name: The C smoke test
      shell: bash
      run: |
        cmake -S corvus-regex-ecma262-capi/tests/native -B build/native -DCRE_LIB_DIR="$PWD/target/release"
        cmake --build build/native --config Release
        ctest --test-dir build/native -C Release --output-on-failure
    - name: The ECMA-262 test data through the C library
      # A C program (tools/c/dataset.c) linking the library through its header, judged as the Rust runner judges the
      # crate: 0 wrong, and every file's counts the crate's.
      shell: bash
      run: |
        cmake -S tools/c -B build/tools -DCRE_LIB_DIR="$PWD/target/release"
        cmake --build build/tools --config Release -j 4
        build/tools/bin/dataset ecma262-regex-test-data/data wrong-cases-c.tsv | tee dataset-c.txt
        target/release/dataset ecma262-regex-test-data/data wrong-cases.tsv > dataset-rust.txt
        counts() { sed -E 's/ +[0-9.]+s\r?$//; s/  in [0-9.]+s\r?$//' "$1"; }
        diff <(counts dataset-rust.txt) <(counts dataset-c.txt)
    - name: Keep the wrong cases
      if: failure()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: wrong-cases-${{ matrix.os }}
        path: wrong-cases*.tsv

  capi:
    # The C library's archives on every release platform (capi.yml), with no filter of paths, so the gate can
    # require them.
    uses: ./.github/workflows/capi.yml

  gate:
    # The one check of this workflow that the ruleset of main requires: it passes when every job above passed (or was
    # skipped), so a job added here is required with no change to the ruleset.
    name: CI gate
    if: always()
    needs: [build, capi]
    runs-on: ubuntu-latest
    steps:
    - name: Every job passed
      env:
        RESULTS: ${{ toJSON(needs.*.result) }}
      run: |
        echo "$RESULTS"
        if echo "$RESULTS" | grep -qE '"(failure|cancelled)"'; then exit 1; fi

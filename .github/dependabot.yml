version: 2
updates:
# The harness image's base images, pinned by digest: one grouped pull request a month moves them, so that an engine's
# version (a compiler, a runtime, a library from the base image) changes only by a merge.
- package-ecosystem: docker
  directory: /
  schedule:
    interval: monthly
  groups:
    base-images:
      patterns: ["*"]
# The harness image's base images, pinned by digest: one grouped pull request a month moves them, so that an engine's
# version (a compiler, a runtime, a library from the base image) changes only by a merge.
  ignore:
    # Node is the V8 the test data was written with (manifest.json, "node"): its version moves with the data, by hand.
    - dependency-name: "node"
      update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    # A new major version of a compiler or runtime is a decision, not a monthly refresh.
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]
- package-ecosystem: docker
  directory: /tools/c
  schedule:
    interval: monthly
  groups:
    base-images:
      patterns: ["*"]
  ignore:
    # Node is the V8 the test data was written with (manifest.json, "node"): its version moves with the data, by hand.
    - dependency-name: "node"
      update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
    # A new major version of a compiler or runtime is a decision, not a monthly refresh.
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]

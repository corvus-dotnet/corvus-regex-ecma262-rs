[package]
name = "corvus-regex-ecma262-capi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The C library over the corvus-regex-ecma262 crate: ECMA-262 regular expressions for C and every language that calls C."
# Released as libraries and a header, not on crates.io.
publish = false

[lib]
# libcorvus_regex_ecma262 (.so/.dylib), corvus_regex_ecma262.dll, and the static library; the rlib lets `cargo test`
# call the C functions directly.
name = "corvus_regex_ecma262"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Renamed: the C library is itself `corvus_regex_ecma262`, and its tests use both.
corvus = { package = "corvus-regex-ecma262", path = "../corvus-regex-ecma262", version = "0.1.0" }

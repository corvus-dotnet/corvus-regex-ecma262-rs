# The Industry benchmarks, daily: every engine in one job on one runner, so that the figures of a run are comparable
# with each other. The harness image (Dockerfile, tools/benchmarks/run.sh) builds and runs this crate over UTF-8 and UTF-16, regex and regress (the
# harness, tools/src/bin/industry.rs), then V8 under Node 24 (tools/benchmarks/v8), with the compliance of each
# ECMA-262 engine over the test data, and writes ONE data file in the results page's shape, published to gh-pages as
# benchmarks/latest.json and benchmarks/runs/<yyyy-mm-dd>-<sha>.json, every day's file kept. No page is built here: the
# central page at https://corvus-oss.org/regex-benchmarks/ is built from every repository's latest.json.
name: benchmarks
on:
  schedule:
  - cron: '41 1 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: The seconds of each workload of each engine (2 is the default; less is for a quick look)
        default: '2'

permissions:
  contents: write

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  industry:
    name: Industry benchmarks, every engine on one runner
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: corvus-dotnet/ecma262-regex-test-data
        ref: 41ed6db477c0d57192673a3a1a76a3b7a194603b
        path: ecma262-regex-test-data
        persist-credentials: false
    - name: Fetch the texts
      run: |
        mkdir -p texts
        for f in $(python3 -c "import json; print(' '.join(sorted({w['file'] for w in json.load(open('tools/benchmarks/workloads.json'))})))"); do
          curl -sSfL -o "texts/$f" "https://raw.githubusercontent.com/dotnet/performance/main/src/benchmarks/micro/libraries/System.Text.RegularExpressions/TestData/$f"
        done
    - name: Build the harness image (the image the release workflow pushes to ghcr.io)
      run: docker build --build-arg COMMIT="${GITHUB_SHA::7}" -t harness .
    - name: Run the harness image
      run: |
        mkdir -p out
        docker run --rm -e SECONDS_EACH='${{ github.event.inputs.seconds || '2' }}' -e RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
          -v "$PWD/tools/benchmarks/workloads.json:/workloads.json:ro" -v "$PWD/texts:/texts:ro" \
          -v "$PWD/ecma262-regex-test-data/data:/data:ro" -v "$PWD/out:/out" harness
    - name: Keep the run
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: industry-${{ github.run_id }}
        path: out
    - name: Publish the data file to gh-pages
      if: github.ref == 'refs/heads/main'
      run: tools/benchmarks/publish.sh out/industry.json "$(date -u +%F)-${GITHUB_SHA::7}"

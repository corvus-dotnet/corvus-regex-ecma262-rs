# The Industry benchmarks, daily: every engine in one job on one runner, so that the figures of a run are comparable
# with each other. This crate over UTF-8 and UTF-16, regex and regress (the harness, tools/src/bin/industry.rs), then V8
# under Node 24 (tools/benchmarks/v8), then the compliance of each engine over the ECMA-262 test data, the record and
# the results page, published to the site at benchmarks/ci/ with the run's data kept under benchmarks/ci/runs/. The
# committed record (docs/benchmarks) is the pinned run and the reference; this is the run of the day.
name: benchmarks
on:
  schedule:
  - cron: '41 1 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: The seconds of each workload of each engine (2 is the record's; less is for a quick look)
        default: '2'

permissions:
  contents: write

concurrency:
  group: benchmarks
  cancel-in-progress: false

jobs:
  industry:
    name: Industry benchmarks, every engine on one runner
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        repository: corvus-dotnet/ecma262-regex-test-data
        ref: 41ed6db477c0d57192673a3a1a76a3b7a194603b
        path: ecma262-regex-test-data
        persist-credentials: false
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '24'
    - name: Install the toolchain of rust-toolchain.toml
      run: rustup show
    - name: Build the harness and the data-set runner
      run: cargo build -j 4 --release --bin industry --bin dataset
    - name: Compliance over the ECMA-262 test data
      run: |
        ./target/release/dataset ecma262-regex-test-data/data wrong-corvus.tsv > compliance-corvus.txt 2>&1 || true
        ./target/release/dataset ecma262-regex-test-data/data wrong-regress.tsv --engine regress > compliance-regress.txt 2>&1 || true
        tail -1 compliance-corvus.txt compliance-regress.txt
    - name: Run this crate, regex and regress
      # The harness downloads the texts into ~/.local/share/corvus-regex-benchmarks on first use; V8 reads them there.
      run: |
        seconds='${{ github.event.inputs.seconds || '2' }}'
        ./target/release/industry tools/benchmarks/workloads.json --seconds "$seconds" --passes 5 --out run.json 2> run.log || { tail -50 run.log; exit 1; }
        tail -3 run.log
    - name: Run V8 (Node 24)
      run: |
        seconds='${{ github.event.inputs.seconds || '2' }}'
        node --version
        node tools/benchmarks/v8/industry.mjs tools/benchmarks/workloads.json "$seconds" 5 > v8.json 2> v8.log
        tail -3 v8.log
    - name: Write the record and the page
      run: |
        python3 tools/benchmarks/industry-results.py --run run.json --v8 v8.json --compliance-corvus compliance-corvus.txt --compliance-regress compliance-regress.txt --host ci --out-dir out --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        cp run.json out/industry-run.json
        cp v8.json out/industry-v8.json
        python3 tools/benchmarks/results-page/generate_site.py --data out/industry.json --out out/index.html
        head -12 out/industry.md
    - name: Keep the run
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: industry-${{ github.run_id }}
        path: |
          out
          run.log
          v8.log
          compliance-*.txt
    - name: Publish to the site
      # The page at benchmarks/ci/ is replaced and the run's data kept under benchmarks/ci/runs/; the rest of gh-pages
      # is untouched (.github/scripts/Update-GhPages.ps1).
      if: github.ref == 'refs/heads/main'
      shell: pwsh
      run: ./.github/scripts/Update-GhPages.ps1 -Mode Benchmarks -Source out -RunName "$(Get-Date -AsUTC -Format yyyy-MM-dd)-$($env:GITHUB_SHA.Substring(0, 7))"

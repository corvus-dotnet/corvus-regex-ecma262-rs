# Publishes the corvus-regex-ecma262 crate to crates.io when a GitHub release tagged v<version> is published, which
# auto-release.yml does after a merged pull request that changed the engine. The version is the tag's: the manifests hold
# 0.0.0, and tools/release/stamp.ps1 writes the tag's version into them before the build (it is never committed, so
# cargo publish is given --allow-dirty). A version already on crates.io publishes nothing, so re-running a release's job
# is safe.
#
# It authenticates with crates.io trusted publishing (OIDC): no token is stored, and the crate's trusted publisher on
# crates.io names this repository and this workflow file, so keep the file name.
#
# crates.io has no staged approval: the publish step makes the version live, and a published version can be yanked
# but never replaced or deleted. The C library (corvus-regex-ecma262-capi) is not published to crates.io; its archives
# are attached to the release (capi-publish.yml).
name: crates-publish
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write  # crates.io trusted publishing

concurrency:
  group: crates-publish
  cancel-in-progress: false

jobs:
  publish:
    # A harness release (a tag starting harness-) publishes the harness images alone.
    if: ${{ !startsWith(github.event.release.tag_name, 'harness-') }}
    name: Publish corvus-regex-ecma262
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: Take the version from the tag and ask whether crates.io has it
      id: version
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
          echo "::error::The release's tag is $TAG, which is not v<major>.<minor>.<patch>."
          exit 1
        fi
        version=${BASH_REMATCH[1]}
        echo "version=$version" >> "$GITHUB_OUTPUT"
        # crates.io answers 404 for a version it does not have; it asks callers for a user agent.
        status=$(curl -s -o /dev/null -w '%{http_code}' -A 'corvus-dotnet/corvus-regex-ecma262-rs crates-publish' \
          "https://crates.io/api/v1/crates/corvus-regex-ecma262/$version")
        case "$status" in
          200)
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::corvus-regex-ecma262 $version is already on crates.io; nothing to publish." ;;
          404)
            echo "published=false" >> "$GITHUB_OUTPUT" ;;
          *)
            echo "::error::crates.io answered $status for corvus-regex-ecma262 $version."
            exit 1 ;;
        esac
    - name: Write the version into the manifests
      if: steps.version.outputs.published == 'false'
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: pwsh -NoProfile -File tools/release/stamp.ps1 -Tag "$TAG"
    - name: Install the toolchain of rust-toolchain.toml
      if: steps.version.outputs.published == 'false'
      run: rustup show
    - name: Format, clippy and the tests
      if: steps.version.outputs.published == 'false'
      run: |
        cargo fmt --all --check
        cargo clippy -j 4 --workspace --all-targets --locked -- -D warnings
        cargo test -j 4 --workspace --locked
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      if: steps.version.outputs.published == 'false'
      with:
        repository: corvus-dotnet/ecma262-regex-test-data
        ref: 1b4c4353c4fa3fc3e318db32ef0261391519b9a5
        path: ecma262-regex-test-data
        persist-credentials: false
    - name: Run the ECMA-262 test data
      if: steps.version.outputs.published == 'false'
      run: cargo run -j 4 --release --locked --bin dataset -- ecma262-regex-test-data/data wrong-cases.tsv
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      if: steps.version.outputs.published == 'false'
      with:
        node-version: '24.22.1'
    - name: Run the ECMA-262 test data for other versions of Unicode and for ECMAScript 2020
      # The data as its own scripts write it for Unicode 13 and 18 (unicode.js apply) and for the grammar of
      # ECMAScript 2020 (edition.js apply), each judged with the crate set to match.
      if: steps.version.outputs.published == 'false'
      shell: pwsh
      run: |
        $runner = './target/release/dataset'
        $data = 'ecma262-regex-test-data'
        $runs = @(
            @{ Name = 'unicode-13'; Tool = 'unicode.js'; Version = '13.0'; Options = @('--unicode', '13') },
            @{ Name = 'unicode-18'; Tool = 'unicode.js'; Version = '18.0'; Options = @('--unicode', '18') },
            @{ Name = 'es2020'; Tool = 'edition.js'; Version = ''; Options = @('--edition', 'es2020') },
            @{ Name = 'es2020-unicode-13'; Tool = 'edition.js'; Version = '13.0'; Options = @('--edition', 'es2020', '--unicode', '13') }
        )
        $failed = @()
        foreach ($run in $runs) {
            $out = Join-Path $env:RUNNER_TEMP $run.Name
            if ($run.Tool -eq 'unicode.js') {
                node "$data/unicode.js" apply $run.Version $out "$data/data"
            }
            else {
                # An empty version is the data's own Unicode.
                node "$data/edition.js" apply $out $run.Version "$data/data"
            }

            if ($LASTEXITCODE -ne 0) { throw "The data for $($run.Name) was not written." }
            & $runner $out "wrong-cases-$($run.Name).tsv" '*.jsonl' both @($run.Options)
            if ($LASTEXITCODE -ne 0) { $failed += $run.Name }
        }

        if ($failed.Count -gt 0) { throw "Wrong: $($failed -join ', ')" }
    - name: The generated Unicode data is what its sources make
      if: steps.version.outputs.published == 'false'
      shell: pwsh
      run: ./tools/unicode/check-tables.ps1 -Properties ecma262-regex-test-data/es2020-properties.json -WorkDirectory "$env:RUNNER_TEMP/unicode-check"
    - name: Package
      # Builds the crate from its packaged sources, as crates.io will.
      if: steps.version.outputs.published == 'false'
      run: cargo publish -p corvus-regex-ecma262 --locked --allow-dirty --dry-run
    - name: Authenticate with crates.io
      if: steps.version.outputs.published == 'false'
      id: auth
      uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
    - name: Publish
      if: steps.version.outputs.published == 'false'
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        cargo publish -p corvus-regex-ecma262 --locked --allow-dirty
        {
          echo "### corvus-regex-ecma262 $VERSION is published"
          echo
          echo "https://crates.io/crates/corvus-regex-ecma262/$VERSION"
        } >> "$GITHUB_STEP_SUMMARY"

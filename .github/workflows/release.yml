# A release: the benchmark harness image (Dockerfile) built and pushed to the GitHub container registry as
# ghcr.io/corvus-dotnet/corvus-regex-ecma262-rs:<version> and :latest, on a tag v<version> or by hand with a version.
# The crates are not published from here.
name: release
on:
  push:
    tags:
    - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: The version to tag the image with (such as 0.1.0)
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: The benchmark harness image
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false
    - name: The version
      id: version
      run: |
        v='${{ github.event.inputs.version }}'
        if [ -z "$v" ]; then v="${GITHUB_REF_NAME#v}"; fi
        echo "version=$v" >> "$GITHUB_OUTPUT"
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        build-args: COMMIT=${{ github.sha }}
        tags: |
          ghcr.io/corvus-dotnet/corvus-regex-ecma262-rs:${{ steps.version.outputs.version }}
          ghcr.io/corvus-dotnet/corvus-regex-ecma262-rs:latest
